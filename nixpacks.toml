# EasyPanel / Nixpacks — força Node 20+ (Next.js 16 exige >= 20.9)
# Preferível: no EasyPanel use Builder = Dockerfile (raiz do repo)

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx prisma generate --schema=./prisma/schema.prisma",
  "npm run build"
]

[start]
cmd = "node server.js"

[variables]
NODE_ENV = "production"
HOST = "0.0.0.0"
PORT = "3000"
NEXT_TELEMETRY_DISABLED = "1"
